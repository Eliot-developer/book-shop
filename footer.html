    <style>
		@font-face{

		}
        * {
            margin: 0;

        }

        body {
            font-family:'B Koodak';
			display: flex;
            flex-direction: column;

        }

        .footer {
			 margin-top: auto;
            background: linear-gradient(135deg, #ffd3e0, #b2ebf2, #ffeaa7);

        }

        .footer .social-icons {

        }

        }

        /* تغییر رنگ هر آیکون هنگام هاور */
        .footer .social-icons a.telegram:hover {

        }

        .footer .social-icons a.whatsapp:hover {
            color: #25d366; /* سبز واتساپ */
        }

        .footer .social-icons a.instagram:hover {
            color: #BF25F1; /* صورتی اینستاگرام */
        }

        .footer .social-icons a.youtube:hover {
            color: #ff0000; /* قرمز یوتیوب */
        }

        .footer .footer-links {
            margin-top: 15px;
        }

        .footer .footer-links a {
            display: inline-block;
            margin: 0 15px;
            color: #555;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer .footer-links a:hover {
            color: #F97F6D;
        }

        .footer p {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
